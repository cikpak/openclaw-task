services:
  openclaw:
    build:
      context: .
      dockerfile: deploy/openclaw.Dockerfile
    init: true
    entrypoint: ['node', '/messenger/openclaw-start.mjs']
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Run pnpm setup:env first}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-anthropic/claude-sonnet-4-5}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - bootstrap:/bootstrap
      - ./deploy/openclaw-start.mjs:/messenger/openclaw-start.mjs:ro
      - ./deploy/bootstrap-policy.mjs:/messenger/bootstrap-policy.mjs:ro
    networks: [gateway]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:https').get('https://127.0.0.1:18789/healthz',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    init: true
    environment:
      NODE_ENV: production
      TRUST_PROXY_HOPS: '1'
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Run pnpm setup:env first}
      SESSION_KEY: ${SESSION_KEY:?Run pnpm setup:env first}
      ALLOW_INSECURE_LOOPBACK: ${ALLOW_INSECURE_LOOPBACK:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      GATEWAY_URL: wss://openclaw:18789
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Run pnpm setup:env first}
      GATEWAY_TLS_FINGERPRINT_FILE: /bootstrap/gateway-fingerprint.txt
      GATEWAY_PUBLIC_IDENTITY_FILE: /bootstrap/backend-identity.json
      GATEWAY_WORKSPACE_DIR: /gateway-workspace
    depends_on:
      openclaw:
        condition: service_healthy
    volumes:
      - backend-data:/data
      - bootstrap:/bootstrap
      - type: volume
        source: openclaw-data
        target: /gateway-workspace
        read_only: true
        volume:
          subpath: workspace
    networks: [web, gateway]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    environment:
      APP_SITE: ${APP_SITE:-http://localhost}
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80'
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTPS_PORT:-8443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [web, edge]
    restart: unless-stopped
networks:
  web:
    internal: true
  gateway: {}
  edge: {}
volumes:
  backend-data: {}
  openclaw-data: {}
  bootstrap: {}
  caddy-data: {}
  caddy-config: {}
