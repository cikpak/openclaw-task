# Tests the real pinned Gateway against a deterministic, container-local provider.
# Run with a separate project name and .context/test.env; never reuse production volumes.
services:
  openclaw:
    entrypoint: ['node', '/messenger/test-openclaw-start.mjs']
    volumes:
      - ./deploy/test-openclaw-start.mjs:/messenger/test-openclaw-start.mjs:ro
    environment:
      DEFAULT_MODEL: mock/test-model
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
  frontend:
    ports: !override
      - '127.0.0.1:${ACCEPTANCE_PORT:-18080}:80'
  backend:
    command: ['node', '/diagnostic/backend-recovery-diagnostics.mjs']
    volumes:
      - ./deploy/backend-recovery-diagnostics.mjs:/diagnostic/backend-recovery-diagnostics.mjs:ro
    environment:
      APP_ORIGIN: http://localhost:${ACCEPTANCE_PORT:-18080}
