name: openclaw-demo
region: fra
ingress:
  rules:
    - component:
        name: messenger
      match:
        path:
          prefix: /
services:
  - name: messenger
    github:
      repo: cikpak/openclaw-task
      branch: master
      deploy_on_push: false
    source_dir: /
    dockerfile_path: deploy/app-platform.Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-2vcpu-4gb
    health_check:
      http_path: /ready
      port: 8080
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    termination:
      drain_seconds: 0
      grace_period_seconds: 30
    # Add APP_USERNAME, DEFAULT_MODEL and encrypted credentials to messenger
    # in DigitalOcean. Omit placeholders: component values override app values.
    envs:
      - key: APP_ORIGIN
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ALLOW_INSECURE_LOOPBACK
        scope: RUN_TIME
        value: 'false'
